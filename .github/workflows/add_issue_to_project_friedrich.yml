name: Add bugs to bugs project

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          # You can target a project in a different organization
          # to the issue
          project-url: https://github.com/users/frievoe97/projects/3
          github-token: ${{ secrets.FRIEDRICH_TASKS }}
          labeled: Friedrich
