[project]
version = "4.8.2"
name = "simwrapper"
description = "SimWrapper command line tools"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "avro>=1.12.1",
    "blosc>=1.11.3",
    "build>=1.2.2.post1",
    "click>=8.0",
    "fastapi>=0.115.0",
    "h5py>=3.0",
    "lxml>=5.0",
    "matsim-tools>=0.0.22",
    "numpy>=1.24",
    "openmatrix>=0.3.5.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyproj>=3.5",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "types-lxml>=2026.2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
simwrapper = "simwrapper.cli:cli"

[project.urls]
Homepage = "https://docs.simwrapper.app"
Repository = "https://github.com/simwrapper/simwrapper"

[tool.hatch.build]
# the built app is gitignored (generated by scripts/build-python.sh) but must ship in the package
artifacts = ["simwrapper/static/"]

[build-system]
requires = ["hatchling", "build"]
build-backend = "hatchling.build"
